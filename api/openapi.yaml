openapi: 3.1.0
info:
  title: Flashka API
  version: 0.1.0
  license: { name: Proprietary, identifier: LicenseRef-Proprietary }
servers:
  - url: /
paths:
  /api/v1/auth/register:
    post:
      summary: Register a user and start a session
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201": { $ref: "#/components/responses/RegisterCreated" }
        "400": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "409": { $ref: "#/components/responses/AuthError" }
        "422": { $ref: "#/components/responses/AuthError" }
        "500": { $ref: "#/components/responses/AuthError" }
  /api/v1/auth/login:
    post:
      summary: Start a session with login and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200": { $ref: "#/components/responses/LoginSucceeded" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "422": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/LoginRateLimited" }
        "500": { $ref: "#/components/responses/AuthError" }
  /api/v1/auth/logout:
    post:
      summary: End the current browser session
      operationId: logout
      security: []
      responses:
        "204": { $ref: "#/components/responses/LogoutSucceeded" }
        "403": { $ref: "#/components/responses/AuthError" }
        "500": { $ref: "#/components/responses/AuthError" }
  /api/v1/auth/me:
    get:
      summary: Get the current authenticated user
      operationId: currentUser
      responses:
        "200": { $ref: "#/components/responses/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/AuthError" }
  /health/live:
    get:
      summary: Check whether the HTTP process is alive
      operationId: liveness
      security: []
      responses:
        "200": { $ref: "#/components/responses/HealthOK" }
  /health/ready:
    get:
      summary: Check whether PostgreSQL is ready
      operationId: readiness
      security: []
      responses:
        "200": { $ref: "#/components/responses/HealthOK" }
        "503": { $ref: "#/components/responses/HealthError" }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: flashka_session }
  headers:
    RequestID:
      description: Server-generated request identifier; client values are ignored.
      schema: { type: string, format: uuid }
    NoStore:
      description: Authentication responses must not be cached.
      schema: { type: string, const: no-store }
    NoSniff: { schema: { type: string, const: nosniff } }
    NoReferrer: { schema: { type: string, const: no-referrer } }
    ContentSecurityPolicy:
      description: Restrictive same-origin content security policy.
      schema: { type: string }
    PermissionsPolicy:
      description: Disables unused browser capabilities.
      schema: { type: string }
    HSTS:
      description: Present only in production HTTPS responses.
      schema: { type: string }
    SessionCookie:
      description: HttpOnly, SameSite=Lax session cookie; Secure in production.
      schema: { type: string }
    ClearSessionCookie:
      description: Clears the current session cookie with the same attributes.
      schema: { type: string }
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{2,31}$" }
        password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
    User:
      type: object
      additionalProperties: false
      required: [id, login]
      properties:
        id: { type: string, format: uuid }
        login: { type: string }
    UserEnvelope:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/User" }
    APIError:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string, format: uuid }
        fields: { type: object, additionalProperties: { type: string } }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/APIError" }
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ok }
  responses:
    RegisterCreated:
      description: User, Inbox and session were created atomically.
      headers:
        Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" }
        Referrer-Policy: { $ref: "#/components/headers/NoReferrer" }
        Content-Security-Policy: { $ref: "#/components/headers/ContentSecurityPolicy" }
        Permissions-Policy: { $ref: "#/components/headers/PermissionsPolicy" }
        Strict-Transport-Security: { $ref: "#/components/headers/HSTS" }
      content: { application/json: { schema: { $ref: "#/components/schemas/UserEnvelope" } } }
    LoginSucceeded:
      description: A new independent session was created.
      headers:
        Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" }
        Referrer-Policy: { $ref: "#/components/headers/NoReferrer" }
        Content-Security-Policy: { $ref: "#/components/headers/ContentSecurityPolicy" }
        Permissions-Policy: { $ref: "#/components/headers/PermissionsPolicy" }
        Strict-Transport-Security: { $ref: "#/components/headers/HSTS" }
      content: { application/json: { schema: { $ref: "#/components/schemas/UserEnvelope" } } }
    CurrentUser:
      description: Current user. This response never rotates the cookie.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" }
        Referrer-Policy: { $ref: "#/components/headers/NoReferrer" }
        Content-Security-Policy: { $ref: "#/components/headers/ContentSecurityPolicy" }
        Permissions-Policy: { $ref: "#/components/headers/PermissionsPolicy" }
        Strict-Transport-Security: { $ref: "#/components/headers/HSTS" }
      content: { application/json: { schema: { $ref: "#/components/schemas/UserEnvelope" } } }
    LogoutSucceeded:
      description: Current session is absent and its cookie is cleared.
      headers:
        Set-Cookie: { $ref: "#/components/headers/ClearSessionCookie" }
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" }
        Referrer-Policy: { $ref: "#/components/headers/NoReferrer" }
        Content-Security-Policy: { $ref: "#/components/headers/ContentSecurityPolicy" }
        Permissions-Policy: { $ref: "#/components/headers/PermissionsPolicy" }
        Strict-Transport-Security: { $ref: "#/components/headers/HSTS" }
    AuthError:
      description: Authentication request error.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" }
        Referrer-Policy: { $ref: "#/components/headers/NoReferrer" }
        Content-Security-Policy: { $ref: "#/components/headers/ContentSecurityPolicy" }
        Permissions-Policy: { $ref: "#/components/headers/PermissionsPolicy" }
        Strict-Transport-Security: { $ref: "#/components/headers/HSTS" }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Unauthenticated:
      description: No valid session. Set-Cookie is present only when an invalid, unknown or expired cookie is cleared; it is absent when no cookie was sent.
      headers:
        Set-Cookie: { $ref: "#/components/headers/ClearSessionCookie" }
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" }
        Referrer-Policy: { $ref: "#/components/headers/NoReferrer" }
        Content-Security-Policy: { $ref: "#/components/headers/ContentSecurityPolicy" }
        Permissions-Policy: { $ref: "#/components/headers/PermissionsPolicy" }
        Strict-Transport-Security: { $ref: "#/components/headers/HSTS" }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    LoginRateLimited:
      description: Too many failed login attempts for the IP and normalized login.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" }
        Referrer-Policy: { $ref: "#/components/headers/NoReferrer" }
        Content-Security-Policy: { $ref: "#/components/headers/ContentSecurityPolicy" }
        Permissions-Policy: { $ref: "#/components/headers/PermissionsPolicy" }
        Strict-Transport-Security: { $ref: "#/components/headers/HSTS" }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    HealthOK:
      description: Process or dependency is ready.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" }
        Referrer-Policy: { $ref: "#/components/headers/NoReferrer" }
        Content-Security-Policy: { $ref: "#/components/headers/ContentSecurityPolicy" }
        Permissions-Policy: { $ref: "#/components/headers/PermissionsPolicy" }
        Strict-Transport-Security: { $ref: "#/components/headers/HSTS" }
      content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } }
    HealthError:
      description: PostgreSQL is unavailable.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
        X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" }
        Referrer-Policy: { $ref: "#/components/headers/NoReferrer" }
        Content-Security-Policy: { $ref: "#/components/headers/ContentSecurityPolicy" }
        Permissions-Policy: { $ref: "#/components/headers/PermissionsPolicy" }
        Strict-Transport-Security: { $ref: "#/components/headers/HSTS" }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
security:
  - sessionCookie: []
