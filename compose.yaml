services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flashka
      POSTGRES_PASSWORD: flashka
      POSTGRES_DB: flashka
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashka -d flashka"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - flashka-postgres:/var/lib/postgresql/data
volumes:
  flashka-postgres:
