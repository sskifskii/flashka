name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flashka
          POSTGRES_PASSWORD: flashka
          POSTGRES_DB: flashka
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flashka -d flashka"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgres://flashka:flashka@localhost:5432/flashka?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 24,
            cache: npm,
            cache-dependency-path: web/package-lock.json,
          }
      - run: npm ci
        working-directory: web
      - run: make migrate-check
      - run: make check
      - run: make test-integration
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: make migrate-up
      - run: make test-e2e
